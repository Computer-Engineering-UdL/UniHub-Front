<ion-header *ngIf="showTopBar" class="top-bar">
  <ion-toolbar>
    <ion-title slot="start">
      {{ pageTitle | translate }}
    </ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="toggleNotificationPanel()" fill="clear" class="notification-button">
        <ion-icon name="notifications-outline" slot="icon-only"></ion-icon>
        <ion-badge *ngIf="notificationCount > 0" class="notification-badge">{{
          notificationCount
        }}</ion-badge>
      </ion-button>

      <ion-button (click)="toggleTheme()" fill="clear">
        <ion-icon [name]="getThemeIcon()" slot="icon-only"></ion-icon>
      </ion-button>

      <ion-button fill="clear" id="language-trigger-topbar">
        <img
          class="language-flag"
          ngSrc="{{ currentLangIcon }}"
          alt="Language"
          height="20"
          width="20" />
      </ion-button>

      <ion-popover trigger="language-trigger-topbar" [dismissOnSelect]="true">
        <ng-template>
          <ion-content class="language-popover">
            <ion-list>
              <ion-item
                [button]="true"
                (click)="changeLanguage('ca')"
                [class.selected]="currentLanguage === 'ca'">
                <img
                  class="language-flag"
                  ngSrc="assets/flags/ca.png"
                  alt="Català"
                  height="20"
                  width="20" />
                <span class="language-text">Català</span>
                <ion-icon name="checkmark" slot="end" *ngIf="currentLanguage === 'ca'"></ion-icon>
              </ion-item>
              <ion-item
                [button]="true"
                (click)="changeLanguage('es')"
                [class.selected]="currentLanguage === 'es'">
                <img
                  class="language-flag"
                  ngSrc="assets/flags/es.png"
                  alt="Español"
                  height="20"
                  width="20" />
                <span class="language-text">Español</span>
                <ion-icon name="checkmark" slot="end" *ngIf="currentLanguage === 'es'"></ion-icon>
              </ion-item>
              <ion-item
                [button]="true"
                (click)="changeLanguage('en')"
                [class.selected]="currentLanguage === 'en'">
                <img
                  class="language-flag"
                  ngSrc="assets/flags/en.png"
                  alt="English"
                  height="20"
                  width="20" />
                <span class="language-text">English</span>
                <ion-icon name="checkmark" slot="end" *ngIf="currentLanguage === 'en'"></ion-icon>
              </ion-item>
            </ion-list>
          </ion-content>
        </ng-template>
      </ion-popover>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<div class="notification-panel" *ngIf="showNotificationPanel" [@slideIn]>
  <div class="notification-overlay" (click)="closeNotificationPanel()"></div>
  <div class="notification-content">
    <div class="notification-header">
      <h3>{{ 'NOTIFICATIONS.TITLE' | translate }}</h3>
      <div class="notification-actions">
        <ion-button
          fill="clear"
          size="small"
          (click)="markAllAsRead()"
          *ngIf="notificationCount > 0"
          [title]="'NOTIFICATIONS.MARK_ALL_READ' | translate">
          <ion-icon name="checkmark-done-outline" slot="icon-only"></ion-icon>
        </ion-button>
        <ion-button
          fill="clear"
          size="small"
          (click)="clearReadNotifications()"
          [title]="'NOTIFICATIONS.CLEAR_READ' | translate">
          <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
        </ion-button>
        <ion-button fill="clear" size="small" (click)="closeNotificationPanel()">
          <ion-icon name="close-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </div>
    </div>

    <div class="notification-list" *ngIf="notifications.length > 0">
      <div
        class="notification-item"
        *ngFor="let notification of notifications"
        [class.unread]="!notification.read"
        (click)="onNotificationClick(notification)">
        <div class="notification-icon" [class]="'icon-' + notification.category">
          <ion-icon [name]="getNotificationIcon(notification.icon)"></ion-icon>
        </div>
        <div class="notification-body">
          <h4>{{ notification.title | translate }}</h4>
          <p>{{ notification.message }}</p>
          <span class="notification-time">{{ getTimeAgo(notification.timestamp) }}</span>
        </div>
        <div class="notification-indicator" *ngIf="!notification.read"></div>
      </div>
    </div>

    <div class="notification-empty" *ngIf="notifications.length === 0">
      <ion-icon name="notifications-off-outline"></ion-icon>
      <p>{{ 'NOTIFICATIONS.NO_NOTIFICATIONS' | translate }}</p>
    </div>
  </div>
</div>
