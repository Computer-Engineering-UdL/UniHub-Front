<ion-header>
  <ion-toolbar>
    <ion-title>{{ 'MESSAGES.START_CONVERSATION.TITLE' | translate }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <div class="searchbar-input-container searchbar-container" style="margin: 0 12px">
      <ion-searchbar
        [(ngModel)]="searchTerm"
        (ionInput)="onSearchChange($event)"
        [placeholder]="'MESSAGES.START_CONVERSATION.SEARCH_PLACEHOLDER' | translate"
        [debounce]="300"
        [animated]="true"></ion-searchbar>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list *ngIf="!isLoading && users.length > 0" class="user-list">
    <ion-item *ngFor="let user of users" lines="none">
      <ion-avatar slot="start">
        <img [appCachedAvatar]="user?.imgUrl" alt="User avatar" />
      </ion-avatar>
      <ion-label>
        <h3>{{ user.firstName || user.name }} {{ user.lastName }}</h3>
        <p>{{ user.email }}</p>
      </ion-label>
      <ion-button size="small" (click)="startConversation(user)">{{
        'MESSAGES.START_CONVERSATION.START' | translate
      }}</ion-button>
    </ion-item>
  </ion-list>

  <div *ngIf="!isLoading && users.length === 0" class="empty-state">
    <ion-icon name="people-outline"></ion-icon>
    <p>{{ 'MESSAGES.START_CONVERSATION.NO_RESULTS' | translate }}</p>
  </div>

  <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
</ion-content>
